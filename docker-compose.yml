version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gatto-mail-backend
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
      - API_PREFIX=/api/v1
    restart: unless-stopped
    networks:
      - gatto-mail-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gatto-mail-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://backend:3001/api/v1
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - gatto-mail-network

networks:
  gatto-mail-network:
    driver: bridge
